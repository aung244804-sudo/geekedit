name: Native Compose Android APK

on:
  push:
    branches:
      - main
      - feature/native-compose-editor
    paths:
      - "android-native/**"
      - ".github/workflows/build-native-apk.yml"
  pull_request:
    paths:
      - "android-native/**"
      - ".github/workflows/build-native-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build native debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: edit-geek-native-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
