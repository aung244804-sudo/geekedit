name: Edit Geek Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**"
      - "!README.md"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK with Expo EAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Configure Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Initialize or link Expo project
        run: eas init --account aung244804-sudo --non-interactive

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: Build summary
        if: always()
        run: echo "Check the EAS build link in the job logs or Expo dashboard."
